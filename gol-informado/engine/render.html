<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Baloo;src:url(fonts/baloo-2-latin-800-normal.woff2)}
@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:Archivo;src:url(fonts/archivo-black-latin-400-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px}
#ov{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
/* legenda */
.cap{position:absolute;left:40px;right:40px;text-align:center;font-family:Baloo;font-size:100px;line-height:1.02;
  color:#fff;-webkit-text-stroke:11px #000;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.5);transform-origin:50% 60%}
.cap .hl{color:var(--pri);-webkit-text-stroke:11px var(--pri-dark);
  text-shadow:0 0 26px color-mix(in srgb,var(--pri) 45%,transparent),0 8px 0 rgba(0,0,0,.5)}
.wm{position:absolute;left:0;right:0;text-align:center;font-family:Archivo;font-size:30px;letter-spacing:6px;color:rgba(255,255,255,.26)}
/* figurinha */
.sticker{position:absolute;width:300px;transform-origin:50% 50%}
.sticker .card{background:#fff;border-radius:26px;padding:14px;display:flex;align-items:center;justify-content:center;height:240px;
  box-shadow:0 0 0 6px var(--pri),0 0 34px color-mix(in srgb,var(--pri) 60%,transparent),0 18px 30px rgba(0,0,0,.5)}
.sticker img{display:block;max-width:100%;max-height:100%;border-radius:10px}
.label{font-family:Anton;font-size:92px;letter-spacing:2px;text-align:center;margin-top:18px;
  color:var(--pri);-webkit-text-stroke:5px #000;paint-order:stroke fill;
  text-shadow:0 0 20px color-mix(in srgb,var(--pri) 50%,transparent),0 8px 18px rgba(0,0,0,.6)}
/* título: cor sólida + glow suave */
.title{position:absolute;left:40px;right:40px;text-align:center;font-family:Anton;font-size:220px;letter-spacing:3px;line-height:1;
  color:var(--pri);-webkit-text-stroke:6px color-mix(in srgb,var(--pri-dark) 80%,#000);paint-order:stroke fill;
  text-shadow:0 0 22px color-mix(in srgb,var(--pri) 50%,transparent),0 0 60px color-mix(in srgb,var(--pri) 25%,transparent),0 12px 26px rgba(0,0,0,.6)}
/* card de número */
.num{position:absolute;left:0;right:0;display:flex;justify-content:center;transform-origin:50% 50%}
.num .box{background:rgba(7,11,24,.88);border:5px solid var(--pri);border-radius:34px;padding:26px 54px 30px;text-align:center;
  box-shadow:0 0 40px color-mix(in srgb,var(--pri) 35%,transparent),0 20px 40px rgba(0,0,0,.6)}
.num .v{font-family:Anton;font-size:170px;line-height:1;color:var(--pri);text-shadow:0 0 22px color-mix(in srgb,var(--pri) 45%,transparent)}
.num .s{font-family:Archivo;font-size:40px;letter-spacing:6px;color:#fff;margin-top:12px}
/* placar */
.board{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,var(--bg2),var(--bg1) 72%)}
.board:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 6px)}
.shield{position:absolute;width:330px;height:390px;transform-origin:50% 50%}
.shield .s{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);background:#fff}
.shield .s img{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);object-fit:cover;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
.shield .g{position:absolute;inset:-30px;border-radius:40%;background:var(--pri);filter:blur(60px);opacity:.3}
.vs{position:absolute;left:0;right:0;text-align:center;font-family:Anton;font-size:150px;color:#fff}
.score{position:absolute;width:330px;text-align:center;font-family:Anton;font-size:280px;line-height:1;transform-origin:50% 60%}
.score.l{color:var(--loss);text-shadow:0 0 30px color-mix(in srgb,var(--loss) 55%,transparent)}
.score.w{color:var(--win);text-shadow:0 0 30px color-mix(in srgb,var(--win) 55%,transparent)}
.lbl{position:absolute;width:330px;text-align:center;font-family:Archivo;font-size:44px;color:#fff;letter-spacing:4px}
.chip{position:absolute;left:60px;top:90px;font-family:Archivo;font-size:30px;color:#000;background:var(--pri);padding:10px 22px;border-radius:12px;letter-spacing:2px}
.post{position:absolute;left:60px;right:60px;background:rgba(10,14,28,.92);border:3px solid rgba(255,255,255,.12);border-radius:36px;padding:44px 50px 40px;
  box-shadow:0 30px 60px rgba(0,0,0,.55);transform-origin:50% 50%}
.post .src{font-family:Archivo;font-size:38px;letter-spacing:4px;color:var(--pri);margin-bottom:20px}
.post .txt{font-family:Baloo;font-size:80px;line-height:1.12;color:#fff}
.post .bar{display:flex;align-items:center;gap:26px;margin-top:36px;font-family:Archivo;font-size:46px;color:rgba(255,255,255,.75)}
.post .heart{width:104px;height:104px;transform-origin:50% 60%}
.qmark{position:absolute;text-align:center;font-family:Anton;font-size:420px;line-height:1;color:var(--pri);
  text-shadow:0 0 30px color-mix(in srgb,var(--pri) 45%,transparent)}
</style></head>
<body>
<canvas id="bg" width="1080" height="1920"></canvas>
<div id="ov"></div>
<script>
const W=1080,H=1920;
const PALETTES={
 dourado:{pri:'#FFC845',priDark:'#4A3200',bg1:'#070B18',bg2:'#18234A',win:'#3DFF8B',loss:'#FF3D57'},
 laranja:{pri:'#FF7A1A',priDark:'#4A1C00',bg1:'#120A06',bg2:'#3A1A0A',win:'#3DFF8B',loss:'#FF3D57'},
 verde:{pri:'#B8FF2E',priDark:'#1F3A00',bg1:'#05110A',bg2:'#123A1F',win:'#B8FF2E',loss:'#FF3D57'},
};
const CAP_Y=1400,CAP_H=230,WM_GAP=125;
// ---------- easing ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eOut=x=>1-Math.pow(1-clamp(x),3);
const eInOut=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eBack=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const pop=(t,d=.28)=>t<0?0:eBack(t/d);
const fadeOut=(t,end,d=.2)=>clamp((end-t)/d);
// ---------- estado ----------
let SPEC,BASE,FACES={},scenes=[],PAL,TRANS={},imgCache=new Map();
function img(url){
  if(imgCache.has(url))return imgCache.get(url);
  const p=new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img '+url));i.src=url;});
  imgCache.set(url,p);if(imgCache.size>300)imgCache.delete(imgCache.keys().next().value);return p;
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const capHTML=s=>esc(s).replace(/\*([^*]+)\*/g,'<span class="hl">$1</span>');
const rectsHit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const grow=(r,k)=>({x:r.x-r.w*k,y:r.y-r.h*k,w:r.w*(1+2*k),h:r.h*(1+2*k)});
const src=p=>`${BASE}/${p}`;

window.init=async(base,spec,faces,trans)=>{
  BASE=base;SPEC=spec;FACES=faces||{};TRANS=trans||{};
  PAL=PALETTES[spec.palette||'dourado'];const r=document.documentElement.style;
  r.setProperty('--pri',PAL.pri);r.setProperty('--pri-dark',PAL.priDark);r.setProperty('--bg1',PAL.bg1);r.setProperty('--bg2',PAL.bg2);r.setProperty('--win',PAL.win);r.setProperty('--loss',PAL.loss);
  let t0=0;scenes=spec.scenes.map((s,i)=>{const o={...s,i,t0};t0+=s.dur;return o;});
  await document.fonts.ready;
  return spec.duration||t0;
};
// recorte "cover" de uma imagem num retângulo, centrado no rosto (se houver)
function fit(im,faces,tw,th,focus){
  const a=tw/th,iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height;
  let cx=iw/2,cy=ih/2;
  if(focus&&focus.length===2){cx=focus[0];cy=focus[1];}
  else if(faces&&faces.length){const f=faces[0];cx=f.x+f.w/2;cy=f.y+f.h/2;}
  let sw,sh,sx,sy;
  if(iw/ih>a){sh=ih;sw=sh*a;sx=clamp(cx-sw/2,0,iw-sw);sy=0;}
  else{sw=iw;sh=sw/a;sy=clamp(cy-sh*0.38,0,ih-sh);sx=0;}
  return {sx,sy,sw,sh,k:tw/sw};
}
const mapR=(b,c,tx,ty)=>({x:tx+(b.x-c.sx)*c.k,y:ty+(b.y-c.sy)*c.k,w:b.w*c.k,h:b.h*c.k});
function camera(s,lt){
  const kb=s.bg.kb||'in';
  let sc=kb==='none'?1.04:kb==='out'?1.16-0.08*(lt/s.dur):1.05+0.08*(lt/s.dur);
  const punch=s.noPunch?0:1-eOut(lt/.28);
  sc+=0.14*punch;
  return {sc,blur:10*punch};
}
const camBox=(b,sc)=>({x:W/2+(b.x-W/2)*sc,y:H/2+(b.y-H/2)*sc,w:b.w*sc,h:b.h*sc});
function freeSpot(cands,faces,avoid=[]){
  const blocks=[...faces.map(f=>grow(f,.18)),...avoid];
  for(const c of cands)if(!blocks.some(b=>rectsHit(c,b)))return c;
  // nenhum lugar livre: escolhe o que menos invade os rostos
  const ov=(a,b)=>Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
  let best=null,bv=1e18;for(const c of cands){const v=faces.reduce((t,f)=>t+ov(c,f),0);if(v<bv){bv=v;best=c;}}
  return best;
}
function pixelate(cx,r,block){
  const x=Math.max(0,r.x|0),y=Math.max(0,r.y|0),w=Math.min(W-x,r.w|0),h=Math.min(H-y,r.h|0);if(w<4||h<4)return;
  const sw=Math.max(1,(w/block)|0),sh=Math.max(1,(h/block)|0);
  const tmp=pixelate.c||(pixelate.c=document.createElement('canvas'));tmp.width=sw;tmp.height=sh;
  const tx=tmp.getContext('2d');tx.drawImage(cx.canvas,x,y,w,h,0,0,sw,sh);
  cx.imageSmoothingEnabled=false;cx.drawImage(tmp,0,0,sw,sh,x,y,w,h);cx.imageSmoothingEnabled=true;
}
function navyBg(cx){
  const g=cx.createRadialGradient(W/2,H*.4,50,W/2,H*.4,H*.75);g.addColorStop(0,PAL.bg2);g.addColorStop(1,PAL.bg1);
  cx.fillStyle=g;cx.fillRect(0,0,W,H);cx.fillStyle='rgba(255,255,255,.035)';for(let y=0;y<H;y+=6)cx.fillRect(0,y,W,2);
}
// ---------- render de um quadro ----------
window.render=async(T)=>{
  const s=scenes.find(x=>T>=x.t0&&T<x.t0+x.dur)||scenes[scenes.length-1];
  const lt=T-s.t0,fps=SPEC.fps,ov=document.getElementById('ov'),cv=document.getElementById('bg'),cx=cv.getContext('2d');
  let html='';const regions={};      // regiões nomeadas (para círculos): face, left, right, box
  cx.setTransform(1,0,0,1,0,0);cx.filter='none';cx.fillStyle='#000';cx.fillRect(0,0,W,H);
  let faces=[];const b=s.bg;
  if(b.type==='board'){html+=board(s,lt);}
  else{
    let {sc,blur}=camera(s,lt);let ox=W/2,oy=H/2;
    if(b.zoom){                       // zoom-in até o rosto: [escala inicial, final, segundos]
      const zd=b.zoom[2]||s.dur;sc=b.zoom[0]+(b.zoom[1]-b.zoom[0])*eInOut(lt/zd)+(sc-camera({...s,noPunch:true},lt).sc);
      let f0=null;
      if(b.type==='clip'){const fz=FACES['scene'+s.i];if(fz){const fr=fz.frames.find(x=>x.length);if(fr)f0=fr[0];}}
      else if(b.type==='photo'&&FACES[b.src]&&FACES[b.src][0]){f0={...FACES[b.src][0],_img:true};}
      if(b.zoomAt){ox=b.zoomAt[0];oy=b.zoomAt[1];}else if(f0&&!f0._img){ox=f0.x+f0.w/2;oy=f0.y+f0.h/2;}
      s._zo=[ox,oy];
    }
    cx.filter=blur>0.3?`blur(${blur.toFixed(1)}px)`:'none';
    cx.setTransform(sc,0,0,sc,ox*(1-sc),oy*(1-sc));
    if(b.type==='photo'){
      const im=await img(src(b.src)),fs=FACES[b.src]||[],ih0=im.naturalHeight,iw0=im.naturalWidth;
      const foc=b.pan?[iw0/2,ih0*(b.pan[0]+(b.pan[1]-b.pan[0])*eInOut(lt/s.dur))]:b.focus;const c=fit(im,fs,W,H,foc);
      if(b.lift){  // desce a foto e preenche o topo com a própria imagem desfocada (rosto colado no topo)
        cx.save();cx.filter='blur(30px) brightness(.55)';cx.drawImage(im,c.sx,c.sy,c.sw,c.sh,-80,-80,W+160,H+160);cx.restore();
        if(blur>0.3)cx.filter=`blur(${blur.toFixed(1)}px)`;
        const g=cx.createLinearGradient(0,b.lift-90,0,b.lift+60);
        cx.drawImage(im,c.sx,c.sy,c.sw,c.sh,0,b.lift,W,H);
        faces=fs.map(f=>{const r=mapR(f,c,0,0);return {...r,y:r.y+b.lift};});
        cx.save();cx.filter='blur(30px) brightness(.55)';cx.beginPath();cx.rect(0,0,W,b.lift+2);cx.clip();cx.drawImage(im,c.sx,c.sy,c.sw,c.sh,-80,-80,W+160,H+160);cx.restore();
        const gr=cx.createLinearGradient(0,b.lift-40,0,b.lift+120);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,0)');
      }else{cx.drawImage(im,c.sx,c.sy,c.sw,c.sh,0,0,W,H);faces=fs.map(f=>mapR(f,c,0,0));}
      if(b.box)regions.box=mapR({x:b.box[0],y:b.box[1],w:b.box[2],h:b.box[3]},c,0,0);
    }else if(b.type==='clip'){
      const fi=Math.min(Math.floor(lt*fps),(s._n||1)-1);
      const im=await img(`${BASE}/.cache/scene${s.i}/${String(fi+1).padStart(4,'0')}.jpg`);
      cx.drawImage(im,0,0,W,H);
      const f=FACES['scene'+s.i];if(f)faces=f.frames[Math.min(f.frames.length-1,Math.round(fi/f.step))]||[];
    }else if(b.type==='card'){
      const im=await img(src(b.src)),fs=FACES[b.src]||[];
      const c=fit(im,fs,W,H);cx.save();cx.filter='blur(34px) brightness(.45)';cx.drawImage(im,c.sx,c.sy,c.sw,c.sh,-60,-60,W+120,H+120);cx.restore();
      if(blur>0.3)cx.filter=`blur(${blur.toFixed(1)}px)`;
      const cw=980,k=cw/im.naturalWidth,ch=im.naturalHeight*k,x0=(W-cw)/2,y0=(b.y||760)-ch/2;
      cx.save();cx.shadowColor=PAL.pri+'88';cx.shadowBlur=50;cx.fillStyle='#fff';
      cx.beginPath();cx.roundRect(x0-10,y0-10,cw+20,ch+20,30);cx.fill();cx.restore();
      cx.save();cx.beginPath();cx.roundRect(x0,y0,cw,ch,22);cx.clip();cx.drawImage(im,x0,y0,cw,ch);cx.restore();
      const c2={sx:0,sy:0,k};faces=fs.map(f=>mapR(f,c2,x0,y0));
      if(b.box)regions.box=mapR({x:b.box[0],y:b.box[1],w:b.box[2],h:b.box[3]},c2,x0,y0);
    }else if(b.type==='panel'){
      navyBg(cx);
      if(b.img){const im=await img(src(b.img)),w=b.imgW||620,h=w*im.naturalHeight/im.naturalWidth,k=pop(lt-.05,.35)*(1+0.03*Math.sin(lt*3));
        cx.save();cx.translate(W/2,(b.y||760));cx.scale(k,k);cx.shadowColor=PAL.pri+'66';cx.shadowBlur=60;cx.drawImage(im,-w/2,-h/2,w,h);cx.restore();}
    }else if(b.type==='split'){
      for(const side of ['left','right']){
        const p=b[side],x0=side==='left'?0:W/2,ap=p.t||0;if(!p)continue;
        cx.save();cx.beginPath();cx.rect(x0,0,W/2,H);cx.clip();
        if(lt<ap||!p.src){navyBg(cx);}
        if(p.src&&lt>=ap){
          const im=await img(src(p.src)),fs=FACES[p.src]||[],c=fit(im,fs,W/2,H);
          const slide=side==='right'?(1-eOut((lt-ap)/.3))*W/2:-(1-eOut((lt-ap)/.3))*W/2;
          cx.drawImage(im,c.sx,c.sy,c.sw,c.sh,x0+(ap>0?slide:0),0,W/2,H);
          const ff=fs.map(f=>mapR(f,c,x0,0));faces.push(...ff);if(ff[0])regions[side]=ff[0];
        }
        cx.restore();
        if(p.placeholder&&lt<ap)html+=`<div class="qmark" style="left:${x0}px;width:${W/2}px;top:520px;transform:scale(${(pop(lt-.1,.3)*(1+.04*Math.sin(lt*4))).toFixed(3)})">${esc(p.placeholder)}</div>`;
      }
      cx.fillStyle=PAL.pri;cx.fillRect(W/2-4,0,8,H);
    }
    cx.setTransform(1,0,0,1,0,0);cx.filter='none';
    const cb=r=>({x:ox+(r.x-ox)*sc,y:oy+(r.y-oy)*sc,w:r.w*sc,h:r.h*sc});faces=faces.map(cb);for(const k in regions)regions[k]=cb(regions[k]);
    if(faces[0]&&!regions.face)regions.face=faces[0];
    const px=(s.fx||[]).find(f=>f.type==='pixelate');
    if(px&&lt<px.until){for(const f of faces)pixelate(cx,grow(f,.15),28);}
    if(b.type!=='panel'){const vg=cx.createRadialGradient(W/2,H*.45,H*.25,W/2,H*.45,H*.75);
      vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');cx.fillStyle=vg;cx.fillRect(0,0,W,H);}
  }
  // transição film burn / light leak (modo screen) no começo da cena
  if(s.trans&&lt<(TRANS[s.trans]||0)/fps){
    const k=Math.floor(lt*fps)+1,tim=await img(`transicoes/${s.trans}/${String(k).padStart(3,'0')}.jpg`);
    cx.save();cx.globalCompositeOperation='screen';cx.drawImage(tim,0,0,W,H);cx.restore();
  }
  // posição da legenda (desvia de rostos)
  let capY=CAP_Y;
  if(faces.some(f=>rectsHit(grow(f,.08),{x:60,y:capY-20,w:W-120,h:CAP_H})))capY=1620;
  // efeitos
  const fx=s.fx||[];
  const titles=fx.filter(f=>f.type==='title'&&lt>=f.t);
  if(titles.length){const f=titles[titles.length-1];const nx=fx.find(g=>g.type==='title'&&g.t>f.t);html+=title(f,lt-f.t,faces,s,lt,capY,nx?nx.t:s.dur);}
  for(const f of fx){
    const ft=lt-(f.t||0);if(f.type==='pixelate'||f.type==='title'||ft<0)continue;
    if(f.type==='sticker')html+=sticker(f,ft,faces,lt,s);
    if(f.type==='circle')html+=circle(f,ft,regions,b.type);
    if(f.type==='number')html+=numberCard(f,ft,faces,lt,s,capY);
    if(f.type==='post')html+=postCard(f,ft,lt,s);
  }
  // legenda (tempos absolutos)
  const caps=SPEC.captions||[];let c=null;
  for(const k of caps){if(T>=k.t)c=k;else break;}
  if(c&&T<(c.end??1e9)+0.5){
    const ct=T-c.t,k=ct<0.16?0.82+0.18*eBack(ct/.16):1;
    html+=`<div class="cap" style="top:${capY}px;transform:scale(${k.toFixed(3)})">${capHTML(c.text)}</div>`;
  }
  html+=`<div class="wm" style="top:${capY+WM_GAP}px">${esc(SPEC.watermark||'')}</div>`;
  ov.innerHTML=html;
};
function sticker(f,ft,faces,lt,s){
  const sw=300,sh=f.label?240+18+100:240;
  const cands=[];
  for(const fc of faces)cands.push({x:fc.x+fc.w/2-sw/2,y:fc.y-sh-40,w:sw,h:sh});
  const yy=f.y||170;
  cands.push({x:W-60-sw,y:yy,w:sw,h:sh},{x:60,y:yy,w:sw,h:sh},{x:W-60-sw,y:620,w:sw,h:sh},{x:60,y:620,w:sw,h:sh});
  const ok=cands.filter(c=>c.x>=30&&c.y>=120&&c.x+c.w<=W-30&&c.y+c.h<CAP_Y-40);
  const spot=freeSpot(ok,faces)||ok[0];
  const hold=f.hold||2.6,k=pop(ft,.32),end=Math.min(fadeOut(lt,s.dur,.18),clamp((hold-ft)/.2)),rot=(f.rot??-7)+Math.sin(ft*2.4)*1.5,bob=Math.sin(ft*2)*6;
  const im=f.flag?`node_modules/flag-icons/flags/4x3/${f.flag}.svg`:src(f.src);
  return `<div class="sticker" style="left:${spot.x}px;top:${spot.y+bob}px;transform:scale(${(k*end).toFixed(3)}) rotate(${rot.toFixed(2)}deg)">
    <div class="card"><img src="${im}"></div>${f.label?`<div class="label">${esc(f.label)}</div>`:''}</div>`;
}
function title(f,ft,faces,s,lt,capY,until){
  const th=230;
  const ys=f.y?[f.y]:[150,330,560,800,1030];
  const bands=ys.map(y=>({x:80,y,w:W-160,h:th}));
  const spot=freeSpot(bands.filter(b=>b.y+b.h<capY-20),faces)||bands[0];
  const k=ft<.22?1.35-0.35*eOut(ft/.22):1,o=clamp(ft/.12)*fadeOut(lt,until,.15);
  const size=f.size||(f.text.length>9?Math.max(120,Math.round(220*9/f.text.length)):220);
  return `<div class="title" style="top:${spot.y+(th-size)/2}px;font-size:${size}px;opacity:${o.toFixed(3)};transform:scale(${k.toFixed(3)})">${esc(f.text)}</div>`;
}
function numberCard(f,ft,faces,lt,s,capY){
  const h=300,ys=[300,520,760,980].map(y=>({x:120,y,w:W-240,h}));
  const spot=freeSpot(ys.filter(b=>b.y+b.h<capY-20),faces)||ys[1];
  const until=f.until?f.until:s.dur;if(lt>until)return '';
  const k=pop(ft,.3)*fadeOut(lt,until,.15);
  return `<div class="num" style="top:${spot.y}px;transform:scale(${k.toFixed(3)})"><div class="box"><div class="v">${esc(f.text)}</div>${f.sub?`<div class="s">${esc(f.sub)}</div>`:''}</div></div>`;
}
function postCard(f,ft,lt,s){
  const k=0.9+0.1*eOut(ft/.4),o=clamp(ft/.3)*fadeOut(lt,s.dur,.2),bob=Math.sin(ft*1.6)*6;
  const ht=f.heart!=null?lt-f.heart:-1,on=ht>=0,hk=on?pop(ht,.35):1;
  const col=on?'var(--loss)':'none',stroke=on?'var(--loss)':'rgba(255,255,255,.7)';
  return `<div class="post" style="top:${(f.y||560)+bob}px;opacity:${o.toFixed(3)};transform:scale(${k.toFixed(3)})">
   <div class="src">${esc(f.src||'')}</div><div class="txt">${esc(f.text)}</div>
   <div class="bar"><svg class="heart" viewBox="0 0 24 24" style="transform:scale(${hk.toFixed(3)});filter:${on?'drop-shadow(0 0 14px rgba(255,61,87,.6))':'none'}"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.1 1.7-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="${col}" stroke="${stroke}" stroke-width="1.6"/></svg>
   <span>${on?esc(f.liker||'curtiu'):''}</span></div></div>`;
}
function circle(f,ft,regions,bgType){
  if(bgType==='clip')return '';   // regra do canal: círculo só em foto
  // anel redondo (nunca oval), cor sólida, brilho discreto; aparece em "relógio" a partir das 12h
  const fc=regions[f.target||'face'];if(!fc)return '';
  const DRAW=f.draw||0.75,dur=f.hold||1.6,draw=Math.pow(clamp(ft/DRAW),2.6),o=clamp((dur+DRAW-ft)/.35);if(o<=0)return '';  // começa lento e termina rápido (tipo time remapping)
  const isBox=f.target==='box';
  const cxp=fc.x+fc.w/2,cyp=fc.y+fc.h/2;
  let r=Math.max(fc.w,fc.h)*(isBox?0.95:0.66);r=Math.max(r,isBox?70:120);
  const sw=Math.round(clamp(r*0.11,16,30)),m=10+sw/2;
  r=Math.min(r,cxp-m,W-m-cxp,cyp-m,H-m-cyp);
  const C=2*Math.PI*r,pad=sw+14,S=2*(r+pad);
  const RING={celeste:'#5EC8FF',dourado:'#FFC845',roxo:'#A855F7',azul:'#2F8CFF',verde:'#7CFF2B',vermelho:'#FF3B4E',laranja:'#FF7A1A',ciano:'#22D3EE',rosa:'#FF4FA3'};
  const col=RING[f.color]||f.color||RING[SPEC.ringColor]||SPEC.ringColor||'var(--pri)';
  return `<svg class="abs" style="left:${cxp-r-pad}px;top:${cyp-r-pad}px;opacity:${o.toFixed(3)};filter:drop-shadow(0 0 10px color-mix(in srgb,${col} 65%,transparent)) drop-shadow(0 0 26px color-mix(in srgb,${col} 35%,transparent)) drop-shadow(0 3px 4px rgba(0,0,0,.35))" width="${S}" height="${S}">
   <circle cx="${S/2}" cy="${S/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}"
    stroke-dasharray="${(C*draw).toFixed(2)} ${(C*(1-draw)+0.01).toFixed(2)}" transform="rotate(-90 ${S/2} ${S/2})"/></svg>`;
}
function board(s,lt){
  const b=s.bg,L=115,R=635,top=650;
  const sh=(t0,x,team)=>{const k=pop(lt-t0,.32);
    if(team.src)return `<div class="shield" style="left:${x}px;top:${top}px;transform:scale(${k.toFixed(3)})"><div class="g"></div><img src="${src(team.src)}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))"></div>`;
    return `<div class="shield" style="left:${x}px;top:${top}px;transform:scale(${k.toFixed(3)})"><div class="g"></div><div class="s"><img src="node_modules/flag-icons/flags/4x3/${team.flag}.svg"></div></div>`;};
  const sc=(t0,x,team,cls)=>{const k=pop(lt-t0,.3);return `<div class="score ${cls}" style="left:${x}px;top:330px;transform:scale(${k.toFixed(3)})">${team.score}</div>`;};
  const lbl=(t0,x,team)=>`<div class="lbl" style="left:${x}px;top:1070px;opacity:${clamp((lt-t0)/.2)}">${esc(team.name)}</div>`;
  const hw=b.home.score>b.away.score;
  let h=`<div class="board"></div>`;
  if(b.tag)h+=`<div class="chip" style="transform:translateX(${(-1+eOut(lt/.35))*500}px)">${esc(b.tag)}</div>`;
  h+=sh(.15,L,b.home)+lbl(.3,L,b.home);
  h+=`<div class="vs" style="top:770px;opacity:${clamp((lt-.45)/.15)};transform:scale(${pop(lt-.45,.25).toFixed(3)})">X</div>`;
  h+=sh(.6,R,b.away)+lbl(.75,R,b.away);
  h+=sc(1.1,L,b.home,hw?'w':'l')+sc(1.5,R,b.away,hw?'l':'w');
  return h;
}
window.events=()=>{
  const ev=[];let wi=0;const W3=['whoosh3','whoosh10','whoosh4'];  // só os curtos/suaves (sem whoosh longo tipo onda)
  for(const s of scenes){
    if(s.i>0){
      if(s.riser)ev.push({t:s.t0-1.55,k:'riser_metallic'});
      else if(s.trans)ev.push({t:s.t0,k:'burn_'+s.trans});           // som original do film burn
      else if(!s.noPunch&&(s.whoosh??(s.i%3===2)))ev.push({t:s.t0-0.12,k:W3[(wi++)%W3.length]});  // whoosh só em parte das trocas
    }
    for(const f of (s.fx||[])){
      const t=s.t0+(f.t||0);
      if(f.type==='sticker')ev.push({t,k:'pop1'});
      if(f.type==='title'||f.type==='number'){const money=f.cash??/€|R\$|US\$|MILH|SAL[AÁ]RIO|EUROS/i.test((f.text||'')+' '+(f.sub||''));ev.push({t,k:money?'cash':'hit'});}
      if(f.type==='post'&&f.heart!=null)ev.push({t:s.t0+f.heart,k:'pop1'});
      if(f.type==='circle'&&s.bg.type!=='clip')ev.push({t,k:'marker'});
      if(f.type==='pixelate')ev.push({t:s.t0+f.until,k:'reveal'});
    }
    if(s.bg.type==='board'){[.15,.6].forEach(d=>ev.push({t:s.t0+d,k:'pop1'}));[1.1,1.5].forEach(d=>ev.push({t:s.t0+d,k:'hit'}));}
  }
  return ev;
};
