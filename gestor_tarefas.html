<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tarefas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1E1E1E;
            color: white;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }
        .task-list {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #555;
        }
        .task-item:last-child {
            border-bottom: none;
        }
        .task-checkbox {
            transform: scale(1.3);
        }
        .analysis {
            background: #444;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .warning {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gestor de Tarefas</h1>
        
        <div class="task-list">
            <h2>Minhas Tarefas</h2>
            <div class="task-item">
                <span>Lavar roupa</span>
                <input type="checkbox" class="task-checkbox">
            </div>
            <div class="task-item">
                <span>Estudar inglês</span>
                <input type="checkbox" class="task-checkbox">
            </div>
        </div>

        <div class="analysis">
            <h2>Análise de Produtividade</h2>
            <p>✔️ Concluídas: 2</p>
            <p>❌ Não Concluídas: 4</p>
            <p class="warning">⚠️ Atenção! Muitas tarefas não concluídas.</p>
        </div>
    </div>
</body>
</html>
